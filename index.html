<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Video Survey Junction, 21 Sep – 3 Nov 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #16202e;
  --muted: #5f6b7c;
  --line: #d9dfe8;
  --navy: #1f4e79;
  --navy-ink: #ffffff;
  --before-bg: #f6dedf;
  --before-line: #c05659;
  --before-ink: #6a2124;
  --after-bg: #d6ebf4;
  --after-line: #3a8fb3;
  --after-ink: #0e4560;
  --free-bg: #eceef2;
  --free-line: #c3cad5;
  --done: #2f8a5b;
  --tune-bg: #fbecc4;
  --tune-line: #c38f14;
  --tune-ink: #5a4000;
  --focus: #1f4e79;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151d;
    --surface: #17202b;
    --ink: #e7ecf3;
    --muted: #97a3b4;
    --line: #2a3644;
    --navy: #6fa6d8;
    --navy-ink: #0f151d;
    --before-bg: #3b2326;
    --before-line: #d27679;
    --before-ink: #f3c9cb;
    --after-bg: #172f3b;
    --after-line: #5fb0d2;
    --after-ink: #bfe3f2;
    --free-bg: #1c2632;
    --free-line: #38465a;
    --done: #58c08a;
    --tune-bg: #3a2f14;
    --tune-line: #d9ab3b;
    --tune-ink: #f3dfa5;
    --focus: #6fa6d8;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151d;
  --surface: #17202b;
  --ink: #e7ecf3;
  --muted: #97a3b4;
  --line: #2a3644;
  --navy: #6fa6d8;
  --navy-ink: #0f151d;
  --before-bg: #3b2326;
  --before-line: #d27679;
  --before-ink: #f3c9cb;
  --after-bg: #172f3b;
  --after-line: #5fb0d2;
  --after-ink: #bfe3f2;
  --free-bg: #1c2632;
  --free-line: #38465a;
  --done: #58c08a;
  --tune-bg: #3a2f14;
  --tune-line: #d9ab3b;
  --tune-ink: #f3dfa5;
  --focus: #6fa6d8;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.45;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

header h1 { margin: 0 0 4px; font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 700; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); }
header p.sync { margin-top: 4px; font-size: 0.85rem; min-height: 1.3em; }
header p.sync.ok { color: var(--done); }
header p.sync.err { color: var(--before-line); font-weight: 600; }

.stats { display: flex; flex-wrap: wrap; gap: 28px; margin: 22px 0 14px; align-items: flex-end; }
.stat b { display: block; font-size: 1.9rem; font-weight: 700; line-height: 1.05; }
.stat span { color: var(--muted); font-size: 0.85rem; }
.progress { flex: 1 1 260px; min-width: 220px; }
.bar { height: 8px; background: var(--free-bg); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .25s ease; }

.filters {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 10px 0; margin-bottom: 8px;
  border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center;
}
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group .lbl { color: var(--muted); font-size: 0.85rem; margin-right: 2px; }
.chip {
  font: inherit; font-size: 0.85rem; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 4px 11px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.chip:focus-visible, .slot:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.week { margin-top: 26px; }
.week h2 { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.week h2 small { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.day { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 250px; }
.day.today { border-color: var(--navy); box-shadow: 0 0 0 2px var(--navy); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; }
.day-h b { font-weight: 600; }
.day-h span { color: var(--muted); font-size: 0.88rem; }
.badge-today { background: var(--navy); color: var(--navy-ink); font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.slots { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 6px; }
.slot.full { grid-row: span 2; }

.slot {
  text-align: left; font: inherit; color: inherit;
  border: 1px solid; border-left-width: 4px; border-radius: 4px;
  padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;
  cursor: pointer; transition: opacity .15s ease, background-color .15s ease;
  width: 100%;
}
.slot.before { background: var(--before-bg); border-color: var(--before-line); color: var(--before-ink); }
.slot.after { background: var(--after-bg); border-color: var(--after-line); color: var(--after-ink); }
.slot.tune { background: var(--tune-bg); border-color: var(--tune-line); color: var(--tune-ink); }
.extras { display: flex; flex-direction: column; gap: 6px; }
.slot.free { background: var(--free-bg); border: 1px dashed var(--free-line); color: var(--muted); cursor: default; }
.slot.dim { opacity: 0.22; }
.slot-top { display: flex; justify-content: space-between; gap: 6px; font-size: 0.8rem; font-weight: 600; }
.slot-top .kind { font-weight: 600; }
.junc { font-weight: 700; font-size: 0.98rem; line-height: 1.3; overflow-wrap: anywhere; }
.meta { font-size: 0.82rem; opacity: 0.88; }
.note { font-size: 0.8rem; font-style: italic; opacity: 0.92; }
.flag { font-size: 0.78rem; font-weight: 600; border-top: 1px dashed currentColor; padding-top: 3px; margin-top: 2px; }
.free-txt { font-size: 0.85rem; }
.tick { display: none; font-weight: 700; color: var(--done); }
.slot.done { background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(47,138,91,.10) 7px 8px); }
.slot.done .junc { text-decoration: line-through; text-decoration-thickness: 2px; }
.slot.done .tick { display: inline; }

.foot { margin-top: 16px; color: var(--muted); font-size: 0.82rem; }

@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 540px) {
  .wrap { padding: 20px 14px 50px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .day { min-height: 0; }
  .slots { grid-template-rows: none; }
  .slot.full { grid-row: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Timeline video survey junction</h1>
    <p>21 Sep – 3 Nov 2026. Data is synced live with the team!</p>
    <p class="sync" id="sync" role="status" aria-live="polite"></p>
  </header>

  <div class="stats" id="stats">
    <p>Loading team progress...</p>
  </div>

  <div class="filters" role="toolbar" aria-label="Tapis timeline">
    <div class="group" id="fAuth"><span class="lbl">Pihak berkuasa</span></div>
    <div class="group" id="fKind"><span class="lbl">Jenis video</span></div>
  </div>

  <main id="weeks"></main>

  <p class="foot">Warna ikut sheet asal: merah jambu ialah Before, biru ialah After, kuning ialah fine-tune seminggu sebelum After, kelabu putus-putus ialah slot kosong.</p>
</div>

<script>
// Google Apps Script Web App URL (saves progress to your Google Sheet)
const WEB_APP_URL = "https://script.google.com/a/macros/southmax.com.my/s/AKfycbxuEODr5uvcGS8GKcfi1O4dCE_GNki4SN8ackIxzxRmOqzAMEUsC9-YDyOuI48E4z4/exec";
// How often (ms) to pull other people's changes while the page is open
const POLL_MS = 20000;

var AUTH = { MBJB: "Majlis Bandaraya Johor Bahru", MBPG: "Majlis Bandaraya Pasir Gudang", MBIP: "Majlis Bandaraya Iskandar Puteri", MPKu: "Majlis Perbandaran Kulai" };
var PK = "Phase 1+2 (combined)";
function tune(sl, a, j, forD, clash){ var o = {s: sl, t: "tune", a: a, p: "Fine-tune", j: j, n: "Untuk After " + forD}; if (clash) o.flag = "Bertindih dengan sesi lain hari ni"; return o; }
var DATA = [
  ["2026-09-21", [{s:"full",t:"after",a:"MBJB",p:"Phase 1",j:"A13",n:"Before: fix time. After: on demand."}]],
  ["2026-09-22", [ {s:"am",t:"before",a:"MBJB",p:"Phase 2",j:"B74 + B75 + B79"}, {s:"pm",t:"before",a:"MPKu",p:PK,j:"(PT001K + PT002K + PT003K) + PT004K",n:"PT004K: scout lebuh Putra Utama & Persiaran Indahpura Utama (roundabout)"}]],
  ["2026-09-23", [ {s:"am",t:"before",a:"MPKu",p:"Phase 2",j:"356T"}, {s:"pm",t:"before",a:"MPKu",p:PK,j:"PT008K, (376T + PT009K)"}]],
  ["2026-09-24", [ {s:"am",t:"before",a:"MBPG",p:"Phase 2",j:"A7 + A33 + A8 + A9"}, {s:"pm",t:"before",a:"MPKu",p:PK,j:"PT005K + PT006K"}]],
  ["2026-09-28", [{s:"full",t:"before",a:"MBJB",p:"Phase 1",j:"A13"}]],
  ["2026-09-29", [{s:"full",t:"before",a:"MBPG",p:"Phase 2",j:"A11, A12"}], [tune("x","MBPG","A11, A12","6/10",1)]],
  ["2026-09-30", [{s:"full",t:"before",a:"MBIP",p:"Phase 2",j:"B45, (D1/D2 + D2/D3)"}]],
  ["2026-10-01", [{s:"full",t:"before",a:"MBJB",p:"Phase 2",j:"B39 + B40"}], [tune("x","MBIP","(D12 – D15)","8/10",1)]],
  ["2026-10-05", [{s:"full",t:"free"}]],
  ["2026-10-06", [ {s:"am",t:"after",a:"MBPG",p:"Phase 2",j:"A11, A12"}, {s:"pm",t:"before",a:"MBPG",p:"Phase 2",j:"A7 + A33 + A8 + A9"}], [tune("x","MPKu","356T","13/10",1), tune("x","MPKu","(PT001K + PT002K + PT003K) + PT004K","13/10",1)]],
  ["2026-10-07", [ tune("am","MBPG","A7 + A33 + A8 + A9","14/10"), {s:"pm",t:"before",a:"MBJB",p:"Phase 2",j:"B74 + B75 + B79"}]],
  ["2026-10-08", [{s:"full",t:"after",a:"MBIP",p:"Phase 2",j:"(D12 – D15)"}], [tune("x","MBIP","B45, (D1 – D2)","15/10",1)]],
  ["2026-10-12", [{s:"full",t:"free"}]],
  ["2026-10-13", [ {s:"am",t:"after",a:"MPKu",p:"Phase 2",j:"356T"}, {s:"pm",t:"after",a:"MPKu",p:PK,j:"(PT001K + PT002K + PT003K) + PT004K",flag:"Dalam sheet: 14/10 (Tuesday)"}], [tune("x","MBJB","B39 + B40","20/10",1)]],
  ["2026-10-14", [{s:"full",t:"after",a:"MBPG",p:"Phase 2",j:"A7 + A33 + A8 + A9",flag:"Dalam sheet: 15/10 (Wednesday)"}], [tune("x","MBJB","B74 + B75 + B79","21/10",1)]],
  ["2026-10-15", [{s:"full",t:"after",a:"MBIP",p:"Phase 2",j:"B45, (D1 – D2)",flag:"Dalam sheet: 16/10 (Thursday)"}], [tune("x","MPKu","PT008K, (376T + PT009K)","22/10",1)]],
  ["2026-10-19", [{s:"full",t:"free"}]],
  ["2026-10-20", [{s:"full",t:"after",a:"MBJB",p:"Phase 2",j:"B39 + B40"}], [tune("x","MPKu","PT005K + PT006K","27/10",1)]],
  ["2026-10-21", [{s:"full",t:"after",a:"MBJB",p:"Phase 2",j:"B74 + B75 + B79"}], [tune("x","MBJB","C42","28/10",1)]],
  ["2026-10-22", [ tune("am","MBJB","C62","29/10"), {s:"pm",t:"after",a:"MPKu",p:PK,j:"PT008K, (376T + PT009K)"}]],
  ["2026-10-26", [{s:"full",t:"free"}]],
  ["2026-10-27", [ tune("am","MBPG","A11, A12","3/11"), {s:"pm",t:"after",a:"MPKu",p:PK,j:"PT005K + PT006K"}]],
  ["2026-10-28", [ {s:"am",t:"after",a:"MBJB",p:"Phase 1",j:"C42"}, {s:"pm",t:"free"}]],
  ["2026-10-29", [ {s:"am",t:"after",a:"MBJB",p:"Phase 1",j:"C62"}, {s:"pm",t:"free"}]],
  ["2026-11-02", [{s:"full",t:"free"}]],
  ["2026-11-03", [ {s:"am",t:"free"}, {s:"pm",t:"after",a:"MBPG",p:"Phase 2",j:"A11, A12"}]]
];

var DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; var MON = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
var WHEN = {am:"AM", pm:"PM", full:"AM/PM", x:"Tambahan"}; var KINDLBL = {before:"Before", after:"After", tune:"Fine-tune"};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function parse(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmt(d){ return d.getDate() + " " + MON[d.getMonth()]; }
function keyOf(d){ var m = d.getMonth()+1, dd = d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd; }
function mondayOf(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return keyOf(x); }
function idOf(dateKey, s, idx){ return dateKey + "-" + s.s + (s.s === "x" ? idx : ""); }

var done = {};      // slot id -> 1 when finished (shared with the team)
var pending = {};   // slot id -> true/false for changes still being saved
var filt = { auth: "all", kind: "all" };

function isConfigured(){ return typeof WEB_APP_URL === "string" && WEB_APP_URL.indexOf("https://script.google.com/") === 0; }

function setStatus(text, kind){
  var el = document.getElementById("sync");
  el.textContent = text;
  el.className = "sync" + (kind ? " " + kind : "");
}
function timeNow(){ return new Date().toLocaleTimeString("ms-MY", { hour: "2-digit", minute: "2-digit" }); }

// Save one change to the Google Sheet
function syncToSheet(id, isDone){
  return fetch(WEB_APP_URL + "?action=set&id=" + encodeURIComponent(id) + "&done=" + isDone)
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j || !j.ok) throw new Error("Unexpected response from Web App"); });
}

// Load everyone's progress from the Google Sheet
function loadTeamData(){
  if (!isConfigured()) { setStatus("Belum disambung ke Google Sheet. Perubahan tidak disimpan.", "err"); return Promise.resolve(); }
  return fetch(WEB_APP_URL + "?action=get&t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(remote){
      if (!remote || typeof remote !== "object" || Array.isArray(remote)) throw new Error("Unexpected data from Web App");
      done = remote;
      Object.keys(pending).forEach(function(id){ if (pending[id]) done[id] = 1; else delete done[id]; });
      applyDone();
      setStatus("Disegerakkan dengan pasukan pada " + timeNow(), "ok");
    })
    .catch(function(e){
      console.error("Failed to load team data", e);
      setStatus("Tidak dapat sambung ke data pasukan. Semak akses Web App atau muat semula halaman.", "err");
    });
}

function slotHTML(dateKey, s, idx){
  var id = idOf(dateKey, s, idx);
  var fullCls = s.s === "full" ? " full" : "";
  if (s.t === "free") return '<div class="slot free' + fullCls + '"><div class="slot-top"><span>' + WHEN[s.s] + '</span></div><span class="free-txt">Kosong</span></div>';

  var isDone = !!done[id];
  return '<button type="button" class="slot ' + s.t + fullCls + (isDone ? " done" : "") + '" data-id="' + id + '" data-auth="' + s.a + '" data-kind="' + s.t + '" aria-pressed="' + isDone + '" title="' + esc(AUTH[s.a]) + '">' +
    '<span class="slot-top"><span>' + WHEN[s.s] + '</span><span class="kind"><span class="tick">Siap </span>' + KINDLBL[s.t] + '</span></span>' +
    '<span class="junc">' + esc(s.j) + '</span><span class="meta">' + esc(s.a) + ', ' + esc(s.p) + '</span>' +
    (s.n ? '<span class="note">' + esc(s.n) + '</span>' : '') + (s.flag ? '<span class="flag">' + esc(s.flag) + '</span>' : '') + '</button>';
}

function render(){
  var weeks = {}, order = [];
  DATA.forEach(function(row){ var wk = mondayOf(parse(row[0])); if (!weeks[wk]) { weeks[wk] = []; order.push(wk); } weeks[wk].push(row); });
  var todayKey = keyOf(new Date()); var html = "";
  order.forEach(function(wk, i){
    var rows = weeks[wk]; var first = parse(rows[0][0]), last = parse(rows[rows.length-1][0]);
    html += '<section class="week"><h2>Minggu ' + (i+1) + ' <small>' + fmt(first) + ' – ' + fmt(last) + '</small></h2><div class="grid">';
    rows.forEach(function(row){
      var d = parse(row[0]); var isToday = row[0] === todayKey; var slots = row[1];
      html += '<div class="day' + (isToday ? " today" : "") + '" id="d-' + row[0] + '"><div class="day-h"><b>' + DAYN[d.getDay()] + '</b><span>' + (isToday ? '<span class="badge-today">Hari ini</span> ' : '') + fmt(d) + '</span></div><div class="slots">' + slots.map(function(s, k){ return slotHTML(row[0], s, k); }).join("") + '</div>' + (row[2] ? '<div class="extras">' + row[2].map(function(s, k){ return slotHTML(row[0], s, k); }).join("") + '</div>' : '') + '</div>';
    });
    html += '</div></section>';
  });
  document.getElementById("weeks").innerHTML = html;
  applyFilter();
  updateStats();
}

// Update the done/not-done look of existing cards without rebuilding the page
function applyDone(){
  var nodes = document.querySelectorAll(".slot[data-id]");
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i]; var d = !!done[n.getAttribute("data-id")];
    n.classList.toggle("done", d);
    n.setAttribute("aria-pressed", String(d));
  }
  updateStats();
}

function allSlots(){
  var out = [];
  DATA.forEach(function(row){ row[1].forEach(function(s, k){ if (s.t !== "free") out.push({id: idOf(row[0], s, k), t: s.t, date: row[0]}); }); (row[2] || []).forEach(function(s, k){ out.push({id: idOf(row[0], s, k), t: s.t, date: row[0]}); }); });
  return out;
}

function updateStats(){
  var slots = allSlots(); var before = slots.filter(function(x){ return x.t === "before"; }).length;
  var after = slots.filter(function(x){ return x.t === "after"; }).length; var tn = slots.filter(function(x){ return x.t === "tune"; }).length;
  var doneN = slots.filter(function(x){ return done[x.id]; }).length; var days = {}; slots.forEach(function(x){ days[x.date] = 1; });
  var pct = slots.length ? Math.round(doneN / slots.length * 100) : 0;
  document.getElementById("stats").innerHTML = '<div class="stat"><b>' + (before + after) + '</b><span>sesi rakaman</span></div><div class="stat"><b>' + before + '</b><span>Before</span></div><div class="stat"><b>' + after + '</b><span>After</span></div><div class="stat"><b>' + tn + '</b><span>Fine-tune</span></div><div class="stat"><b>' + Object.keys(days).length + '</b><span>hari turun lapangan</span></div><div class="stat progress"><b>' + doneN + ' / ' + slots.length + '</b><span>siap (' + pct + '%)</span><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
}

function applyFilter(){
  var nodes = document.querySelectorAll(".slot[data-auth]");
  for (var i = 0; i < nodes.length; i++) { var n = nodes[i]; var ok = (filt.auth === "all" || n.getAttribute("data-auth") === filt.auth) && (filt.kind === "all" || n.getAttribute("data-kind") === filt.kind); n.classList.toggle("dim", !ok); }
}

function buildChips(containerId, key, items){
  var box = document.getElementById(containerId);
  items.forEach(function(it){
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = it.label; b.setAttribute("data-v", it.value); b.setAttribute("aria-pressed", it.value === "all" ? "true" : "false");
    if (it.title) b.title = it.title;
    b.addEventListener("click", function(){ filt[key] = it.value; var sibs = box.querySelectorAll(".chip"); for (var i = 0; i < sibs.length; i++) sibs[i].setAttribute("aria-pressed", sibs[i] === b ? "true" : "false"); applyFilter(); });
    box.appendChild(b);
  });
}

buildChips("fAuth", "auth", [{value:"all",label:"Semua"}].concat(Object.keys(AUTH).map(function(k){ return {value:k,label:k,title:AUTH[k]}; })));
buildChips("fKind", "kind", [{value:"all",label:"Semua"},{value:"before",label:"Before"},{value:"after",label:"After"},{value:"tune",label:"Fine-tune"}]);

document.getElementById("weeks").addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest(".slot[data-id]") : null;
  if (!el) return;
  var id = el.getAttribute("data-id");
  var isDone = !done[id];
  if (isDone) done[id] = 1; else delete done[id];

  el.classList.toggle("done", isDone);
  el.setAttribute("aria-pressed", String(isDone));
  updateStats();

  if (!isConfigured()) { setStatus("Belum disambung ke Google Sheet. Perubahan tidak disimpan.", "err"); return; }

  pending[id] = isDone;
  setStatus("Menyimpan...", "");
  syncToSheet(id, isDone).then(function(){
    if (pending[id] === isDone) delete pending[id];
    setStatus("Disimpan dan dikongsi dengan pasukan pada " + timeNow(), "ok");
  }).catch(function(err){
    console.error("Failed to save", err);
    if (pending[id] !== isDone) return; // a newer click already replaced this change
    delete pending[id];
    if (isDone) delete done[id]; else done[id] = 1; // undo, since it was not saved
    applyDone();
    setStatus("Gagal simpan. Perubahan dibatalkan. Semak akses Web App dan cuba lagi.", "err");
  });
});

// Initial render, then load the team's saved progress
render();
loadTeamData();

// Keep the page live: refresh while the tab is visible and when you switch back to it
setInterval(function(){ if (!document.hidden) loadTeamData(); }, POLL_MS);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) loadTeamData(); });
</script>
